name: CI

# Blindaje técnico (2026-09-08), hermano del CI del backend
# (api-uscate-back/.github/workflows/ci.yml): corre exactamente el mismo
# `next build` que ya rompió una vez en producción por un error real de tsc
# en un módulo compartido, en cada push/PR a `main` — antes de que
# `deploy-to-droplet.sh` lo intente construir en el droplet.
#
# Hallazgo real del primer run de este workflow: un paso de `npm run lint`
# reventaba con 305 errores reales preexistentes (mayoría
# `@typescript-eslint/no-explicit-any`, algunos `react-hooks/static-
# components`) en todo el proyecto — nunca atrapados antes porque
# `next build` corre una pasada de lint más liviana que el CLI de `eslint`
# completo (confirmado real: los mismos 2 deploys reales de esta sesión
# compilaron limpio con `next build` sin verlos). Arreglar 305 errores de
# golpe es su propio trabajo, no algo que quepa en "CI real" — se deja el
# lint FUERA del gate a propósito (documentado, no silenciado) hasta que
# se limpie aparte.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Requerido por `lib/apis.ts` (revienta el build si falta) — valor
      # dummy real, nunca se usa para una llamada de red real en CI.
      NEXT_PUBLIC_API_URL: 'https://ci-placeholder.invalid'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build real (mismo paso que corre deploy-to-droplet.sh en el droplet)
        run: npm run build
